<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mercado Fácil</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">

<meta name="theme-color" content="#22c55e">
</head>

<body>

<div class="container">

<header>
<h1>🛒 Mercado Fácil</h1>
<p>Controle sua compra em tempo real</p>
</header>

<section class="budget-card">

<label>Orçamento (R$)</label>
<input type="number" id="orcamento" placeholder="300">

<div class="progress-area">
<div class="progress-bar">
<div id="progress"></div>
</div>
</div>

<div class="totals">
<p>Total: <span id="total">R$ 0,00</span></p>
<p>Restante: <span id="restante">R$ 0,00</span></p>
</div>

</section>

<section class="card">

<h2>Adicionar Item</h2>

<input type="text" id="nome" placeholder="Nome do produto">

<select id="tipo">
<option value="unidade">Produto por unidade</option>
<option value="peso">Hortifruti (kg)</option>
</select>

<div id="campos"></div>

<button onclick="adicionarItem()">
Adicionar
</button>

</section>

<section class="card">

<h2>Itens da Compra</h2>

<div id="lista"></div>

</section>

<button class="danger" onclick="novaCompra()">
Nova Compra
</button>

</div>

<script src="app.js"></script>

</body>
</html>
